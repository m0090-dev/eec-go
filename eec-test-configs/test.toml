[[configs]]
description = "Full Integration Test (TOML)"

[[envs]]
key = "APP_NAME"
value = "eec-toml-core"

[[envs]]
key = "APP_ROOT"
value = "D:\\work\\${APP_NAME}"

[[envs]]
key = "HOST_NAME"
value = "$(hostname)"

[[envs]]
key = "APP_SUMMARY"
value = "Host:${HOST_NAME}_Name:${APP_NAME}_OS:$(echo %OS% || uname)"

[[envs]]
key = "PATH"
value = [
    "${APP_ROOT}\\exec",
    "C:\\external\\tools"
]

[program]
path = "cmd"
args = ["/c", "set APP_ && echo %PATH%"]
