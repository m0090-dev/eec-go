name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            build_lib: true
          - os: ubuntu-latest
            goos: linux
            build_lib: false
          - os: macos-latest
            goos: darwin
            build_lib: false
    runs-on: ${{ matrix.os }}
    
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Mage
        run: go install github.com/magefile/mage@latest

      - name: Install build-essential (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build with Mage
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: 1
        shell: bash
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          mage BuildCLIRelease
          if [ "${{ matrix.build_lib }}" = "true" ]; then mage BuildLibRelease; fi

      # 各OSの成果物をひとつのZIPにまとめる
      - name: Package Assets
        shell: bash
        run: |
          # アーカイブ名（例: eec-v1.0.0-windows.zip）
          ZIP_NAME="eec-${{ github.ref_name }}-${{ matrix.goos }}.zip"
          
          # buildディレクトリに移動して圧縮
          cd build
          
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            # Windows: 7zを使ってGUIフォルダや各種EXEを固める
            7z a "../${ZIP_NAME}" ./*
          else
            # Linux/macOS: zipコマンド（標準搭載）を使用
            zip -r "../${ZIP_NAME}" ./*
          fi
          
          echo "ZIP_PATH=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          # ZIPファイルのみをアップロード
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
