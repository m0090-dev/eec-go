name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            build_lib: true
            build_gui: true
          - os: ubuntu-latest
            goos: linux
            build_lib: true
            build_gui: false # Linux上でWin用GUIをビルドしない（重複回避）
          - os: macos-latest
            goos: darwin
            build_lib: true
            build_gui: false
    runs-on: ${{ matrix.os }}
    
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # GUIビルドが必要なWindowsジョブのみ.NETをセットアップ
      - name: Setup .NET
        if: ${{ matrix.build_gui }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Mage
        uses: magefile/mage-select@v1

      - name: Build with Mage
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: 1 # ライブラリビルドにはCGOが必須
        run: |
          # 1. CLIは全OSで共通
          mage BuildCLIRelease
          
          # 2. ライブラリはそのOSがターゲットの時だけ実行（matrixで制御）
          if [ "${{ matrix.build_lib }}" = "true" ]; then
            mage BuildLibRelease
          fi
          
          # 3. GUIはWindowsジョブのみで実行
          if [ "${{ matrix.build_gui }}" = "true" ]; then
            mage BuildGUIRelease
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          # buildディレクトリ内の成果物をすべてアップロード
          # 拡張子が違うので、上書きされずに各OSのファイルが並びます
          files: |
            build/eec
            build/eec.exe
            build/eec-deleter
            build/eec-deleter.exe
            build/libcengine.so
            build/libcengine.dll
            build/libcengine.dylib
            build/gui/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
