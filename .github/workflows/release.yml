name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 同じタグのリリースが既に存在しないか確認
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::タグ ${{ github.ref_name }} は既にリリース済みです。同じバージョン番号での再リリースはできません。新しいバージョン番号でタグを作成し直してください。"
            exit 1
          else
            echo "タグ ${{ github.ref_name }} は未使用です。ビルドを続行します。"
          fi
  build:
    needs: guard
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            build_lib: true
          - os: ubuntu-latest
            goos: linux
            build_lib: false
          - os: macos-latest
            goos: darwin
            build_lib: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Embed version from the actual release tag (single source of truth)
        shell: bash
        run: |
          VERSION_NO_V="${GITHUB_REF_NAME#v}"
          echo "Embedding version: $VERSION_NO_V (from tag $GITHUB_REF_NAME)"
          python scripts/update_version.py "$VERSION_NO_V"
      - name: Install Mage
        run: go install github.com/magefile/mage@latest
      - name: Install build-essential (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Build with Mage
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: 1
        shell: bash
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          mage BuildCLIRelease
          if [ "${{ matrix.build_lib }}" = "true" ]; then mage BuildLibRelease; fi
      - name: Package Assets
        shell: bash
        run: |
          ZIP_NAME="eec-${{ github.ref_name }}-${{ matrix.goos }}.zip"
          cd build
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            7z a "../${ZIP_NAME}" ./*
          else
            zip -r "../${ZIP_NAME}" ./*
          fi
          cd ..
          sha256sum "${ZIP_NAME}" | awk '{print $1}' > "${ZIP_NAME}.sha256"
          echo "ZIP_PATH=${ZIP_NAME}" >> $GITHUB_ENV
          echo "SHA256_PATH=${ZIP_NAME}.sha256" >> $GITHUB_ENV
      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.SHA256_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
