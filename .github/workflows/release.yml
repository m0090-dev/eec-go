name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            build_gui: true
            build_lib: true  # Windowsのみライブラリをビルド
          - os: ubuntu-latest
            goos: linux
            build_gui: false
            build_lib: false
          - os: macos-latest
            goos: darwin
            build_gui: false
            build_lib: false
    runs-on: ${{ matrix.os }}
    
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 外部Actionの404エラーを回避するため、Goで直接Mageをインストール
      - name: Install Mage
        run: go install github.com/magefile/mage@latest

      - name: Install build-essential (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Setup .NET
        if: ${{ matrix.build_gui }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build with Mage
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: 1
        shell: bash
        run: |
          # インストールしたMageにパスを通す
          export PATH=$PATH:$(go env GOPATH)/bin
          
          # CLIは全OSでビルド
          mage BuildCLIRelease
          
          # ライブラリはWindowsジョブのみ実行
          if [ "${{ matrix.build_lib }}" = "true" ]; then
            mage BuildLibRelease
          fi
          
          # GUIはWindowsジョブのみ実行
          if [ "${{ matrix.build_gui }}" = "true" ]; then
            mage BuildGUIRelease
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          # 各OSで生成されたバイナリを収集。存在しないファイルは無視されます。
          files: |
            build/eec
            build/eec.exe
            build/eec-deleter
            build/eec-deleter.exe
            build/libcengine.so
            build/libcengine.dll
            build/libcengine.dylib
            build/gui/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
