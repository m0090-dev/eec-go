name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            build_gui: true
          - os: ubuntu-latest
            goos: linux
            build_gui: false
          - os: macos-latest
            goos: darwin
            build_gui: false
    runs-on: ${{ matrix.os }}
    
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Linuxでライブラリをビルドするために必要
      - name: Install build-essential (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Setup .NET
        if: ${{ matrix.build_gui }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 正しいリポジトリ名に修正: magefile/mage-action
      - name: Install Mage
        uses: magefile/mage-action@v2
        with:
          install-only: true

      - name: Build with Mage
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: 1
        run: |
          # CLI & Deleter
          mage BuildCLIRelease
          
          # Shared Library (C-Shared)
          mage BuildLibRelease
          
          # GUI (Windows Job only)
          if [ "${{ matrix.build_gui }}" = "true" ]; then
            mage BuildGUIRelease
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            build/eec
            build/eec.exe
            build/eec-deleter
            build/eec-deleter.exe
            build/libcengine.so
            build/libcengine.dll
            build/libcengine.dylib
            build/gui/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
