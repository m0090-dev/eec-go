name: Test

on:
  push:
    tags:
      - 'v*'
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # -----------------------------
      # 1. Unit Test
      # -----------------------------
      - name: Run Go Unit Tests
        run: go test -v ./...

      # -----------------------------
      # 2. Install Mage
      # -----------------------------
      - name: Install Mage
        run: go install github.com/magefile/mage@latest

      # -----------------------------
      # 3. Build CLI
      # -----------------------------
      - name: Build CLI
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          mage BuildCLIRelease

      - name: Add eec to PATH
        run: echo "$(pwd)/build" >> $GITHUB_PATH

      # -----------------------------
      # 4. test-case1 (TOML分割耐性)
      # -----------------------------
      - name: Test Case1 - Semicolon Safety
        shell: bash
        run: |
          echo "=== test-case1: semicolon should NOT split ==="
          OUTPUT=$(eec dump -c eec-test-configs/test-case1/test1.toml)

          echo "$OUTPUT"

          echo "$OUTPUT" | grep 'TEST_VAR=10;10'

      - name: Test Case1 - Multi file merge
        shell: bash
        run: |
          echo "=== test-case1: merge TOML ==="
          OUTPUT=$(eec dump -c eec-test-configs/test-case1/test2.toml)

          echo "$OUTPUT"

          echo "$OUTPUT" | grep 'DUMMY=hello'

      # -----------------------------
      # 5. test-case2 JSON (基本展開)
      # -----------------------------
      - name: Test Case2 - JSON basic expansion
        shell: bash
        run: |
          echo "=== JSON config expansion ==="
          OUTPUT=$(eec dump -c eec-test-configs/test-case2/test.json)

          echo "$OUTPUT"

          echo "$OUTPUT" | grep 'APP_NAME=eec-json-service'
          echo "$OUTPUT" | grep 'APP_HOME='
          echo "$OUTPUT" | grep 'DEPLOY_TAG='
          echo "$OUTPUT" | grep 'TEST='
          echo "$OUTPUT" | grep 'PATH='

      # -----------------------------
      # 6. test-case2 JSON (PATH配列マージ)
      # -----------------------------
      - name: Test Case2 - PATH array merge
        shell: bash
        run: |
          echo "=== PATH array merge ==="
          OUTPUT=$(eec dump -c eec-test-configs/test-case2/test2.json)

          echo "$OUTPUT"

          echo "$OUTPUT" | grep 'dummy\\test-path-array'
          echo "$OUTPUT" | grep 'another\\dummy-bin'

      # -----------------------------
      # 7. test-case2 TOML (トポロジカルソート)
      # -----------------------------
      - name: Test Case2 - Topological Sort
        shell: bash
        run: |
          echo "=== Topological dependency resolution ==="
          OUTPUT=$(eec dump -c eec-test-configs/test-case2/test.toml)

          echo "$OUTPUT"

          # 最終結果チェック
          echo "$OUTPUT" | grep 'STEP_01=Alpha'
          echo "$OUTPUT" | grep 'STEP_10=Alpha-Beta-Gamma-Delta-Epsilon-Zeta-Eta-Theta-Iota-Kappa'
          echo "$OUTPUT" | grep 'FINAL_CHECK=Result: Alpha-Beta-Gamma-Delta-Epsilon-Zeta-Eta-Theta-Iota-Kappa'

      # -----------------------------
      # 8. test-case2 YAML (Map順序耐性)
      # -----------------------------
      - name: Test Case2 - YAML order stress
        shell: bash
        run: |
          echo "=== YAML dependency resolution ==="
          OUTPUT=$(eec dump -c eec-test-configs/test-case2/test.yaml)

          echo "$OUTPUT"

          echo "$OUTPUT" | grep 'STEP_10=Alpha-Beta-Gamma-Delta-Epsilon-Zeta-Eta-Theta-Iota-Kappa'
          echo "$OUTPUT" | grep 'FINAL_CHECK=Result:Alpha-Beta-Gamma-Delta-Epsilon-Zeta-Eta-Theta-Iota-Kappa'

      # -----------------------------
      # 9. クロスチェック（壊れやすいポイント）
      # -----------------------------
      - name: Cross-check PATH contains expanded values
        shell: bash
        run: |
          OUTPUT=$(eec dump -c eec-test-configs/test-case2/test.toml)

          echo "$OUTPUT"

          echo "$OUTPUT" | grep 'D:\\work\\Alpha-Beta-Gamma-Delta-Epsilon-Zeta-Eta-Theta-Iota-Kappa'
          echo "$OUTPUT" | grep 'C:\\test\\Alpha'
